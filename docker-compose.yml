services:
  nginx:
    image: nginx-sc23
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./html:/usr/share/nginx/html
      - ./sc23.key:/etc/nginx/ssl/sc23.key
      - ./sc23.crt:/etc/nginx/ssl/sc23.crt
      - ./certs/acme-webroot:/var/www/certbot:ro
    depends_on:
      - renting
      - padel-api
      - padel-radar
      - wise-frog
      - status
      - xml-diff
      - rope-ruins
      - rope-ruins-web
    networks:
      - the-main-network

  status:
    image: status
    build:
      context: projects/docker-stats-fastapi
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - the-main-network

  renting:
    image: astro-renting
    build:
      context: projects/renting-data-generator
      dockerfile: Dockerfile
    networks:
      - the-main-network

  wise-frog:
    image: wise-frog
    build:
      context: projects/wise-frog
      dockerfile: Dockerfile
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - the-main-network


  padel-radar:
    image: padel-radar
    build:
      context: projects/padel-radar-app
      dockerfile: Dockerfile
    depends_on:
      - padel-api
    networks:
      - the-main-network

  padel-api:
    environment:
      - PT_ENV=${PT_ENV}
      - PT_ALLOWED_ORIGINS=${PT_ALLOWED_ORIGINS}
      - FLASK_ENV=${FLASK_ENV}
      - FLASK_DEBUG=${FLASK_DEBUG}
      - LOCATION_IQ_API_KEY=${LOCATION_IQ_API_KEY}
      - CACHE_REDIS_HOST=padel-redis
      - FLASK_APP=app
    image: padel-api
    build:
      context: projects/padel-tavernes
      dockerfile: Dockerfile
    volumes:
      - ./projects/padel-tavernes/app:/app/app
    depends_on:
      - padel-redis
      # - padel-postgres
    networks:
      - the-main-network

  padel-redis:
    image: redis:alpine
    networks:
      - the-main-network

  xml-diff:
    image: xml-diff
    build:
      context: projects/xml-diff-comparator
      dockerfile: Dockerfile
    networks:
      - the-main-network

  rope-ruins:
    image: sc23-rope-ruins:local
    build:
      context: projects/hook-rush
      dockerfile: docker/source.Dockerfile
      target: server
    platform: linux/amd64
    expose:
      - "24567"
    networks:
      - the-main-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  rope-ruins-web:
    image: sc23-rope-ruins-web:local
    build:
      context: projects/hook-rush
      dockerfile: docker/source.Dockerfile
      target: web
      args:
        WEB_ENDPOINT: wss://sc23.site/rope/
    platform: linux/amd64
    expose:
      - "8080"
    networks:
      - the-main-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  the-main-network:
    driver: bridge
