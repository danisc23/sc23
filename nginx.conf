# Browser origins for the public game's WebSocket upgrade. Native clients send
# the endpoint origin too. Domain, TLS and admission policy belong to SC23.
map $http_origin $rope_origin_allowed {
    default 0;
    "https://html-classic.itch.zone" 1;
    "https://html.itch.zone" 1;
    "https://sc23.site" 1;
    "https://sc23.local" 1;
    "https://roperuins.sc23.site" 1;
    "https://roperuins.sc23.local" 1;
}
limit_req_zone $binary_remote_addr zone=rope_handshakes:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=rope_connections:1m;

server {
    listen 443 ssl;
    server_name sc23.local sc23.site;

    ssl_certificate /etc/nginx/ssl/sc23.crt;
    ssl_certificate_key /etc/nginx/ssl/sc23.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location = /rope/ {
        if ($rope_origin_allowed = 0) { return 403; }
        limit_req zone=rope_handshakes burst=20 nodelay;
        limit_req_status 429;
        limit_conn rope_connections 32;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $rope_upstream rope-ruins:24567;
        proxy_pass http://$rope_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name renting.sc23.local renting.sc23.site;

    ssl_certificate /etc/nginx/ssl/sc23.crt;
    ssl_certificate_key /etc/nginx/ssl/sc23.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";

    location / {
        proxy_pass http://renting:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

